[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aspenplus-mcp"
version = "0.1.0"
description = "MCP server for Aspen Plus process simulation integration"
readme = "README.md"
requires-python = ">=3.11"  # py2aspen requires 3.11+
license = {text = "MIT"}
authors = [
    {name = "Daniel B"}
]
dependencies = [
    "mcp>=2.3.0,<3",  # uses mcp.server.mcpserver.MCPServer (mcp 2.x API)
    "pydantic>=2.0",
    "pywin32>=306; platform_system=='Windows'",  # basic mode
    # enhanced mode (flowsheet editing); BSD-3-Clause, pre-1.0 -> pinned to minor
    "py2aspen>=0.3,<0.4; platform_system=='Windows'",
]

[project.scripts]
aspenplus-mcp = "aspenplus_mcp.server:run"

# Dev dependencies (installed automatically by `uv sync`;
# with pip: `pip install --group dev` (pip >= 25.1))
[dependency-groups]
dev = [
    "pytest>=7.0.0",
    "black>=23.0.0",
    "mypy>=1.0.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
